# Managed tier, vendor side (docs/architecture/23-managed.md). Run from this directory.
# Tenants live in tenants.json; `npx tsx ../scripts/tenant.ts add <name>` regenerates tenants.yml and Caddyfile.
include:
  - tenants.yml

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
